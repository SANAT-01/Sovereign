services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: multi_purpose
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

  minio:
    # MinIO rebranded to AIStor — the image moved to the minio/aistor/*
    # path on quay.io. Pinned to a specific release (not :latest, which
    # 401s without a login) since that's what pulled successfully.
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: apppassword
      # Free-tier license, read from the git-ignored root .env file —
      # never commit this value or paste it into chat/code directly.
      MINIO_LICENSE: ${MINIO_LICENSE}
    ports:
      - "127.0.0.1:9000:9000" # S3 API + public object URLs (local dev)
      - "127.0.0.1:9001:9001" # Web console
    volumes:
      - minio-data:/data

  # One-shot: creates the bucket and sets it public-read, then exits.
  # Idempotent — safe to run on every `docker compose up`.
  minio-init:
    image: quay.io/minio/aistor/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 app apppassword; do sleep 1; done;
      mc mb --ignore-existing local/multi-purpose-uploads;
      mc anonymous set none local/multi-purpose-uploads;
      mc anonymous set download local/multi-purpose-uploads/avatars;
      mc anonymous set download local/multi-purpose-uploads/portfolio;
      "

  # General-purpose event bus (APPROACH.md §22) — KRaft single-node, no
  # Zookeeper. Two listeners because two different kinds of client need
  # to reach the same broker: the host-run API process (`npm run dev`,
  # the normal day-to-day workflow — see root package.json's "dev"
  # script) via the published `localhost` port, and the containerized
  # `api` service (used by `npm run dev:all`, and in prod) via the
  # compose network's `kafka` DNS name. Neither address resolves
  # correctly for the other kind of client, so both listeners must exist
  # side by side (verified against the official apache/kafka image's own
  # example single-node KRaft compose file).
  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: Za9EaZiiYIlRyqZL43WBRA
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topics are pre-created explicitly by kafka-init below, not
      # auto-created on first publish — same "don't rely on implicit
      # setup" reasoning as minio-init creating the bucket explicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092" # PLAINTEXT_HOST — used by the host-run API process in normal `npm run dev`
    volumes:
      - kafka-data:/var/lib/kafka/data

  # One-shot: pre-creates reminders.send/.dlq with explicit partition
  # counts, then exits. Idempotent (--if-not-exists) — same pattern as
  # minio-init. reminders.send gets 3 partitions, keyed by userId, so a
  # given user's messages always land on the same partition (ordering);
  # the DLQ is a low-volume inspection sink, 1 partition is enough.
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c "
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list; do sleep 1; done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic reminders.send --partitions 3 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic reminders.send.dlq --partitions 1 --replication-factor 1;
      "

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      # Override the .env file's host-dev values with container-network
      # hostnames — everything else (SESSION_SECRET, GOOGLE_CLIENT_ID/SECRET)
      # still comes from the env_file above. FRONTEND_URL and
      # MINIO_PUBLIC_URL stay as localhost: both are URLs the *browser*
      # follows (OAuth redirect, avatar image src), not container-to-container
      # calls, so they must stay on the published host port.
      DATABASE_URL: postgres://app:app@db:5432/multi_purpose
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      KAFKA_BROKERS: kafka:19092
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - db
      - minio
      - kafka

  web:
    build:
      context: ./apps/web
      args:
        # Baked at build time — next.config.js's rewrites() (CSR proxy) is
        # resolved into .next/routes-manifest.json during `next build`, not
        # read fresh at container start.
        API_URL: http://api:4000
    restart: unless-stopped
    environment:
      # Read at runtime for SSR direct calls (APPROACH.md §6), which go
      # container-to-container, not through localhost.
      API_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  db-data:
  pgadmin-data:
  minio-data:
  kafka-data:
