services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: multi_purpose
    # No published port — internal only, not even to the VPS host (APPROACH.md §6).
    volumes:
      - db-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_LICENSE: ${MINIO_LICENSE}
    volumes:
      - minio-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-files.rule=Host(`files.sanattudu.tech`)"
      - "traefik.http.routers.minio-files.entrypoints=websecure"
      - "traefik.http.routers.minio-files.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-files.loadbalancer.server.port=9000"
    networks:
      - internal
      - traefik-network

  minio-init:
    image: quay.io/minio/aistor/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb --ignore-existing local/multi-purpose-uploads;
      mc anonymous set download local/multi-purpose-uploads;
      "
    networks:
      - internal

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/multi_purpose
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
    # No published port — reachable only as http://api:4000 inside the
    # compose network (APPROACH.md §6/§17).
    depends_on:
      - db
      - minio
    networks:
      - internal

  web:
    build:
      context: ./apps/web
      args:
        # Baked at build time — next.config.js's rewrites() (CSR proxy) is
        # resolved into .next/routes-manifest.json during `next build`, not
        # read fresh at container start.
        API_URL: http://api:4000
    restart: unless-stopped
    environment:
      # Read at runtime for SSR direct calls (APPROACH.md §6).
      API_URL: http://api:4000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`sanattudu.tech`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    depends_on:
      - api
    networks:
      - internal
      - traefik-network

networks:
  internal: {}
  # Pre-existing network Traefik and the VPS's other apps already use —
  # created outside this compose file (`docker network create traefik-network`).
  traefik-network:
    external: true

volumes:
  db-data:
  minio-data:
