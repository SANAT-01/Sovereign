services:
  minio:
    # MinIO rebranded to AIStor — the image moved to the minio/aistor/*
    # path on quay.io. Pinned to a specific release (not :latest, which
    # 401s without a login) since that's what pulled successfully.
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    container_name: mp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Free-tier license, read from the git-ignored root .env file —
      # never commit this value or paste it into chat/code directly.
      MINIO_LICENSE: ${MINIO_LICENSE}
    volumes:
      - minio-data:/data
    networks: [default]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mp-minio-api.rule=Host(`storage.sanattudu.tech`)"
      - "traefik.http.routers.mp-minio-api.entrypoints=websecure"
      - "traefik.http.routers.mp-minio-api.tls=true"
      - "traefik.http.routers.mp-minio-api.tls.certresolver=letsencrypt"
      # Explicit router->service link required — this container defines two
      # services (api + console), so Traefik can't auto-link either router
      # without this (it logs "cannot be linked automatically with multiple
      # Services" and silently drops both routers).
      - "traefik.http.routers.mp-minio-api.service=mp-minio-api"
      - "traefik.http.services.mp-minio-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.mp-minio-console.rule=Host(`storage-console.sanattudu.tech`)"
      - "traefik.http.routers.mp-minio-console.entrypoints=websecure"
      - "traefik.http.routers.mp-minio-console.tls=true"
      - "traefik.http.routers.mp-minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mp-minio-console.service=mp-minio-console"
      - "traefik.http.services.mp-minio-console.loadbalancer.server.port=9001"

  # One-shot: creates the bucket and sets it public-read, then exits.
  # Idempotent — safe to run on every `docker compose up`.
  minio-init:
    image: quay.io/minio/aistor/mc:latest
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 app ${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb --ignore-existing local/multi-purpose-uploads;
      mc anonymous set none local/multi-purpose-uploads;
      mc anonymous set download local/multi-purpose-uploads/avatars;
      mc anonymous set download local/multi-purpose-uploads/portfolio;
      "
    depends_on:
      - minio
    networks: [default]

  # General-purpose event bus (APPROACH.md §22). Internal-only, like
  # `api`/`minio` — never published, no Traefik labels; only `web` is
  # ever public. Same dual-listener config as docker-compose.yml (kept
  # identical across dev/prod to avoid drift) even though prod never
  # actually needs the PLAINTEXT_HOST listener from outside this network.
  kafka:
    image: apache/kafka:4.4.0
    container_name: mp-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: adVBECwg3z7WMiClGSwbrQ
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [default]

  kafka-init:
    image: apache/kafka:4.4.0
    entrypoint: >
      /bin/sh -c "
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list; do sleep 1; done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic reminders.send --partitions 3 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic reminders.send.dlq --partitions 1 --replication-factor 1;
      "
    depends_on:
      - kafka
    networks: [default]

  api:
    build: ./apps/api
    container_name: mp-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      # Override the .env file's host-dev values with container-network
      # hostnames — everything else (SESSION_SECRET, GOOGLE_CLIENT_ID/SECRET)
      # still comes from the env_file above. FRONTEND_URL and
      # MINIO_PUBLIC_URL stay as localhost: both are URLs the *browser*
      # follows (OAuth redirect, avatar image src), not container-to-container
      # calls, so they must stay on the published host port.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/multi_purpose
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      KAFKA_BROKERS: kafka:19092
    networks: [default, backend-net]
    depends_on:
      - minio
      - kafka

  web:
    build:
      context: ./apps/web
      args:
        # Baked at build time — next.config.js's rewrites() (CSR proxy) is
        # resolved into .next/routes-manifest.json during `next build`, not
        # read fresh at container start.
        API_URL: http://api:4000
    container_name: mp-web
    restart: unless-stopped
    environment:
      # Read at runtime for SSR direct calls (APPROACH.md §6), which go
      # container-to-container, not through localhost.
      API_URL: http://api:4000
      HOSTNAME: "0.0.0.0"
    networks: [default]
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mp-web.rule=Host(`sovereign.sanattudu.tech`)"
      - "traefik.http.routers.mp-web.entrypoints=websecure"
      - "traefik.http.routers.mp-web.tls=true"
      - "traefik.http.routers.mp-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.mp-web.loadbalancer.server.port=3000"

networks:
  backend-net:
    external: true

volumes:
  minio-data:
  kafka-data: